<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Zumac/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Zumac">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zumac">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=zumac-official-2">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="zumac-icon.svg?v=zumac-official-2"/>
  <link rel="alternate icon" type="image/png" href="favicon.png?v=zumac-official-2"/>

  <title>Zumac</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #f7faf7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #zumac-bootstrap-status {
      box-sizing: border-box;
      display: flex;
      min-height: 100%;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #17351f;
      text-align: center;
    }

    .zumac-bootstrap-card {
      width: min(420px, 100%);
      padding: 32px 28px;
      border: 1px solid #dce9de;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(23, 53, 31, 0.10);
    }

    .zumac-bootstrap-spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid #dbe9dd;
      border-top-color: #2f7d44;
      border-radius: 50%;
      animation: zumac-spin 0.9s linear infinite;
    }

    #zumac-bootstrap-title {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
    }

    #zumac-bootstrap-message {
      margin: 0;
      color: #57705e;
      font-size: 14px;
      line-height: 1.5;
    }

    #zumac-bootstrap-retry {
      margin-top: 20px;
      padding: 11px 20px;
      border: 0;
      border-radius: 10px;
      background: #2f7d44;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    @keyframes zumac-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="zumac-bootstrap-status" role="status" aria-live="polite">
    <div class="zumac-bootstrap-card">
      <div id="zumac-bootstrap-spinner" class="zumac-bootstrap-spinner"></div>
      <h1 id="zumac-bootstrap-title">Cargando Zumac</h1>
      <p id="zumac-bootstrap-message">Preparando el sistema...</p>
      <button id="zumac-bootstrap-retry" type="button" hidden>
        Volver a intentar
      </button>
    </div>
  </div>

  <script>
    (() => {
      const resetKey = 'zumac-service-worker-reset-v1';
      const status = document.getElementById('zumac-bootstrap-status');
      const spinner = document.getElementById('zumac-bootstrap-spinner');
      const title = document.getElementById('zumac-bootstrap-title');
      const message = document.getElementById('zumac-bootstrap-message');
      const retry = document.getElementById('zumac-bootstrap-retry');

      const showError = (error) => {
        if (window.__zumacFlutterStarted) return;
        clearTimeout(window.__zumacBootstrapTimeout);
        spinner.hidden = true;
        title.textContent = 'No se pudo iniciar Zumac';
        message.textContent =
          'Comprueba tu conexiÃ³n y vuelve a intentarlo. Si el problema continÃºa, actualiza la pÃ¡gina con Ctrl+F5.';
        retry.hidden = false;
        if (error) console.error('Error al iniciar Zumac:', error);
      };

      window.zumacShowBootstrapError = showError;
      window.zumacBootstrapReady = () => {
        clearTimeout(window.__zumacBootstrapTimeout);
        status.remove();
      };

      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('error', (event) => showError(event.error));
      window.addEventListener(
        'unhandledrejection',
        (event) => showError(event.reason),
      );

      window.__zumacBootstrapTimeout = window.setTimeout(() => {
        showError(new Error('Tiempo de espera agotado al descargar la aplicaciÃ³n.'));
      }, 45000);

      const start = async () => {
        if ('serviceWorker' in navigator) {
          const wasControlled = Boolean(navigator.serviceWorker.controller);
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((item) => item.unregister()));

          if (wasControlled && !sessionStorage.getItem(resetKey)) {
            sessionStorage.setItem(resetKey, '1');
            window.location.reload();
            return;
          }

          sessionStorage.removeItem(resetKey);
        }

        const script = document.createElement('script');
        script.src = 'flutter_bootstrap.d9c6486417f1.js';
        script.async = true;
        script.addEventListener('error', () => {
          showError(new Error('No se pudo descargar el inicializador web.'));
        });
        document.body.appendChild(script);
      };

      start().catch(showError);
    })();
  </script>
</body>
</html>

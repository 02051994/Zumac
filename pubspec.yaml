name: appgt_offline_subtables
description: APPGT offline-first con formatos padre y tablas internas.
publish_to: 'none'
version: 0.0.17+17

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: 1.1.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.1
  connectivity_plus: ^6.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.7
  image: ^4.3.0
  image_picker: ^1.1.2
  pdf: ^3.11.3
  file_picker: ^8.3.7
  excel: ^4.0.6
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  mobile_scanner: ^6.0.10
  geolocator: ^13.0.4
  # Dictado de preguntas cortas en Consultor. El reconocimiento se ejecuta
  # mediante el servicio de voz disponible en cada sistema operativo.
  speech_to_text: ^7.4.0
  desktop_drop: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_app.png
    - assets/images/logo_bienvenida.png
